[package]
name = "diamandis-one"
version = "0.1.1"
description = "DIAMANDIS ONE desktop hub"
authors = ["DIAMANDIS"]
edition = "2021"

[lib]
name = "diamandis_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"