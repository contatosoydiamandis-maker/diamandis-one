name: Relatar um bug
description: Informe um problema para ajudar a melhorar o DIAMANDIS ONE.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por ajudar! Não inclua senhas, tokens ou arquivos pessoais."
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      placeholder: "1. Abra..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão/commit
  - type: input
    id: system
    attributes:
      label: Windows e versão
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: extra
    attributes:
      label: Capturas de tela ou informações adicionais
