name: Build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check frontend and build production bundle
        run: npm run check
      - name: Upload generated npm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7

  windows-validation:
    name: Windows tests and NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare desktop assets
        run: npm run prepare:assets
      - name: Run native core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Upload generated Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
      - name: Build desktop app and NSIS installer
        run: npm run tauri build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DIAMANDIS-ONE-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
