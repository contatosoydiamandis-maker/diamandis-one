name: Build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate generated npm lockfile
        run: test -s package-lock.json
      - name: Check frontend and build production bundle
        run: npm run check
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  windows-validation:
    name: Windows tests and NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare desktop assets
        run: npm run prepare:assets
      - name: Run native core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Validate generated Cargo lockfile
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/Cargo.lock") -or (Get-Item "src-tauri/Cargo.lock").Length -eq 0) {
            throw "Cargo.lock não foi gerado. A validação não pode continuar."
          }
      - name: Upload generated Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Reinstall frontend from the generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify Rust dependency graph is locked
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Verify Rust production build is locked
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Build desktop app and NSIS installer
        run: npm run tauri build
      - name: Smoke test install, launch, uninstall and preserve user data
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (!$installer) { throw "Instalador NSIS não encontrado." }
          $installDir = Join-Path $env:RUNNER_TEMP "DiamandisOneSmoke"
          $installerPath = $installer.FullName
          Start-Process -FilePath $installerPath -ArgumentList @("/S", "/D=$installDir") -Wait
          $appExe = Join-Path $installDir "DIAMANDIS ONE.exe"
          if (!(Test-Path $appExe)) {
            $appExe = Get-ChildItem $installDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$appExe -or !(Test-Path $appExe)) { throw "Executável instalado não encontrado." }
          $dataDir = Join-Path $env:LOCALAPPDATA "com.diamandis.one"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $marker = Join-Path $dataDir "ci-uninstall-preservation-marker.txt"
          Set-Content -Path $marker -Value "preserve-user-data"
          $process = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "O aplicativo encerrou inesperadamente durante o teste de abertura." }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (!(Test-Path $uninstaller)) { throw "Desinstalador não encontrado." }
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          if (Test-Path $installDir) { throw "A pasta do aplicativo permaneceu após a desinstalação." }
          if (!(Test-Path $marker)) { throw "Os dados locais do usuário foram removidos pela desinstalação." }
          Remove-Item $marker -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DIAMANDIS-ONE-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
