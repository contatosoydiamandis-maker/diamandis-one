name: Generate and commit dependency lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lockfiles
  cancel-in-progress: false

jobs:
  lockfiles:
    name: Generate and validate lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate npm lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Validate Cargo lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Commit lockfiles when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
            exit 0
          fi
          git commit -m "chore: add reproducible dependency lockfiles"
          git push origin HEAD:main
